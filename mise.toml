[tasks."build:game"]
description = "Build the Godot game"
run = "dotnet build src/Civ.Godot"

[tasks."start:game"]
description = "Build and start the Godot game"
depends = ["build:game"]
run = "godot-mono --path src/Civ.Godot"

[tasks."start:ui-gallery"]
description = "Build and open the widget gallery for the brass UI skin (no mods load)"
depends = ["build:game"]
run = "godot-mono --path src/Civ.Godot res://UiGallery.tscn"

[tasks."start:ui-replica"]
description = "Open the reference sheet's widgets at full size (skin scale 3) to compare with docs/references/ui.png"
depends = ["build:game"]
run = "godot-mono --path src/Civ.Godot --resolution 1672x1000 res://UiGallery.tscn -- --replica"

[tasks.test]
description = "Build once, then run the default tests (excludes E2E, extractor and world generation tests)"
env = { DOTNET_gcServer = "1" }
run = '''
set -u
dotnet build Civ.slnx || exit 1
mise run test:nobuild
'''

[tasks."test:nobuild"]
description = "Run the default tests on the current build (excludes E2E, extractor and world generation tests)"
env = { DOTNET_gcServer = "1" }
run = '''
set -u
filter='Category!=Extractor&Category!=E2E&Category!=WorldGen'
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
# One test host per project, all at once. Each project's output is buffered to its own file so the
# summaries stay readable, then printed as soon as that project finishes.
for project in tests/Civ.Tests/Civ.Tests.csproj tests/Civ.Mods.Tests/Civ.Mods.Tests.csproj tests/Civ.ContentImport.Tests/Civ.ContentImport.Tests.csproj; do
  name=$(basename "$project" .csproj)
  (
    dotnet test "$project" --no-build --filter "$filter" > "$tmp/$name.log" 2>&1
    echo $? > "$tmp/$name.rc"
    cat "$tmp/$name.log"
  ) &
done
wait
fail=0
for rc in "$tmp"/*.rc; do
  [ "$(cat "$rc")" = 0 ] || { echo "FAILED project: $(basename "$rc" .rc)" >&2; fail=1; }
done
exit $fail
'''

[tasks."test:worldgen"]
description = "Run world generation tests (run when the work set touches world generation)"
env = { DOTNET_gcServer = "1" }
run = "dotnet test Civ.slnx --filter 'Category=WorldGen'"

[tasks."test:e2e"]
description = "Run E2E tests"
run = "dotnet test Civ.slnx --filter 'Category=E2E'"

[tasks."test:extractor"]
description = "Run extractor tests"
run = "dotnet test Civ.slnx --filter 'Category=Extractor'"

[tasks.shot]
description = "Build, then capture screenshots. Pass client options after --, e.g. -- --focus hills --clean --out-dir /tmp/shots --screenshot hills (see tools/shots/README.md)"
depends = ["build:game"]
run = "tools/shots/shot.sh"

[tasks."shot:compare"]
description = "Side-by-side and difference image: mise run shot:compare -- before.png after.png out.png"
run = "tools/shots/compare.sh"

[tasks.benchmark]
description = "Run operational benchmarks without timing thresholds"
run = "dotnet run --project tools/Civ.Benchmarks/Civ.Benchmarks.csproj --configuration Release"

[tasks."ai:eval"]
description = "Run repeatable headless AI economic evaluation without AI edits"
run = "dotnet run --project tools/Civ.Benchmarks/Civ.Benchmarks.csproj --configuration Release -- --ai-eval"

[tools]
dotnet = "10"
git-lfs = "latest"
# Godot 4.7.2-stable .NET (mono) build, matching Godot.NET.Sdk/4.7.2 in src/Civ.Godot. Run as `godot-mono`.
"github:godotengine/godot" = { version = "4.7.2-stable", asset_pattern = "Godot_v4.7.2-stable_mono_linux_x86_64.zip", rename_exe = "godot-mono" }

[env]
__NV_PRIME_RENDER_OFFLOAD = "1"
__GLX_VENDOR_LIBRARY_NAME = "nvidia"
